<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="version" content="4.1-R2A">
    <title>Geo-Insights Dashboard - Loading...</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Use Somalia's styles as the universal template -->
    <link rel="stylesheet" href="../somalia/styles.css?v=4.1" />
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="display: flex; align-items: center; justify-content: center; gap: 15px;">
                <a href="https://dataportal.unescwa.org/gis/landing" target="_blank" title="Arab Development Portal - ESCWA" style="text-decoration: none;">
                    <img id="countryLogo" src="../somalia/adp_logo.png" alt="Arab Development Portal" style="height: 44px; vertical-align: middle;">
                </a>
                <span id="headerTitle" style="color: inherit;">Geo-Insights Dashboard</span>
                <a href="../../country-selector.html" title="Back to Country Selector" style="text-decoration: none; font-size: 1.5rem; margin-left: 10px;">🌍</a>
            </h1>
            <div class="subtitle">By Geo-Insight Lab, ESCWA, 2026 <span style="font-size: 0.7em; opacity: 0.5;">(v4.1-R2A)</span></div>
        </div>
        <div id="map"></div>
    </div>

    <!--
    ============================================
    R2A DYNAMIC TEMPLATE SYSTEM - v4.1
    ============================================
    This template redirects to country-specific dashboards.
    For now, only Somalia is fully implemented.
    Other countries will use this same pattern when ready.
    ============================================
    -->

    <script>
        // ============================================
        // DYNAMIC COUNTRY ROUTING - R2A Architecture
        // ============================================

        // Get country from URL parameter
        const COUNTRY = new URLSearchParams(window.location.search).get('country') || 'somalia';
        console.log(`[R2A] Requested country: ${COUNTRY}`);

        // For now, redirect to the country's own dashboard if it exists
        // In the future, this template will load everything dynamically

        const availableCountries = {
            'somalia': '../somalia/index.html'
            // Add more as they become available:
            // 'yemen': '../yemen/index.html',
            // 'jordan': '../jordan/index.html',
        };

        if (availableCountries[COUNTRY]) {
            // Redirect to the country-specific dashboard
            console.log(`[R2A] Redirecting to ${COUNTRY} dashboard...`);
            window.location.replace(availableCountries[COUNTRY]);
        } else {
            // Country not yet available - show message
            document.getElementById('headerTitle').innerHTML = `${COUNTRY.charAt(0).toUpperCase() + COUNTRY.slice(1)} Dashboard`;
            document.getElementById('map').innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #94a3b8;">
                    <div style="font-size: 4em; margin-bottom: 20px;">🚧</div>
                    <h2 style="color: #0ea5e9; margin-bottom: 10px;">${COUNTRY.charAt(0).toUpperCase() + COUNTRY.slice(1)} Dashboard Coming Soon</h2>
                    <p style="max-width: 400px; text-align: center; line-height: 1.6;">
                        We are actively working on expanding Geo-Insights coverage to all 22 Arab countries.
                        <br><br>
                        Currently available: <strong style="color: #22c55e;">Somalia</strong>
                    </p>
                    <a href="../../country-selector.html" style="margin-top: 30px; padding: 12px 24px; background: #0ea5e9; color: white; text-decoration: none; border-radius: 8px; font-weight: bold;">
                        ← Back to Country Selector
                    </a>
                </div>
            `;
        }
    </script>
</body>
</html>

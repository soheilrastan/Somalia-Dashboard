<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="version" content="3.1">
    <title>Geo-Insights - Somalia Dashboard - ESCWA, UN</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="styles_v3.1.css?v=3.1" />
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="display: flex; align-items: center; justify-content: center; gap: 15px;">
                <a href="https://dataportal.unescwa.org/gis/landing" target="_blank" title="Arab Development Portal - ESCWA" style="text-decoration: none;">
                    <img src="adp_logo.png" alt="Arab Development Portal" style="height: 44px; vertical-align: middle;">
                </a>
                <span style="color: inherit;">Geo-Insights: Applications and Extensions, ESCWA, UN</span>
            </h1>
            <div class="subtitle">By Geo-Insight Lab, ESCWA, 2026 <span style="font-size: 0.7em; opacity: 0.5;">(v3.1)</span></div>
        </div>
        <div id="map"></div>
    </div>

    <!-- Shared Modules - Must load BEFORE data and main script -->
    <script>
        // Cache-busting for modules
        const moduleTime = Date.now();
        document.write('<script src="../modules/data-loader.js?v=3.1&t=' + moduleTime + '"><\/script>');
        document.write('<script src="../modules/ddr.js?v=3.1&t=' + moduleTime + '"><\/script>');
        document.write('<script src="../modules/layer-registry.js?v=3.1&t=' + moduleTime + '"><\/script>');
        document.write('<script src="../modules/road-symbology.js?v=3.1&t=' + moduleTime + '"><\/script>');
        document.write('<script src="../modules/ssm-module.js?v=3.1&t=' + moduleTime + '"><\/script>');
        document.write('<script src="../modules/l1-clip.js?v=3.1&t=' + moduleTime + '"><\/script>');
        document.write('<script src="../modules/geo-api.js?v=3.1&t=' + moduleTime + '"><\/script>');
    </script>

    <!-- Data and Main Script -->
    <script>
        // Build timestamp to force cache refresh on every deploy
        const buildTime = Date.now();
        const version = '3.1';
        document.write('<script src="../data_warehouse/core/data.js?v=' + version + '&b=' + buildTime + '"><\/script>');
        document.write('<script src="../data_warehouse/nightlight/bakool_nightlight_polygons_2022.js?v=' + version + '&b=' + buildTime + '"><\/script>');
        document.write('<script src="../data_warehouse/nightlight/bakool_nightlight_polygons_2023.js?v=' + version + '&b=' + buildTime + '"><\/script>');
        document.write('<script src="../modules/isee_analytics.js?v=' + version + '&b=' + buildTime + '"><\/script>');
        document.write('<script src="script_v3.1.js?v=' + version + '&b=' + buildTime + '"><\/script>');
    </script>
</body>
</html>
